name: reproducibility

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Exact symbolic verification
        run: python verification/symbolic_checks.py
      - name: Independent numerical audit
        run: python verification/numerical_deviation_scan.py
      - name: Regression tests
        run: pytest -q
      - name: Regenerate deterministic outputs
        run: python scripts/generate_outputs.py
      - name: Check generated outputs are deterministic
        run: test -z "$(git status --porcelain)"
      - name: Install elan and pinned Lean toolchain
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Reject formal proof placeholders and project axioms
        shell: bash
        run: |
          if grep -nE '\b(sorry|admit)\b' EconomidesFormal.lean; then
            echo 'Blocking proof placeholder found.'
            exit 1
          fi
          if grep -nE '^[[:space:]]*axiom[[:space:]]' EconomidesFormal.lean; then
            echo 'Project-specific axiom found.'
            exit 1
          fi
      - name: Resolve and verify pinned Lean dependencies
        run: |
          lake update
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
      - name: Download mathlib build cache
        run: lake exe cache get
      - name: Kernel-check formal verification
        run: lake build --wfail
      - name: Install TeX
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-bibtex-extra poppler-utils
      - name: Build manuscript
        run: make paper
      - name: Build and compile RIO submission variants
        run: make rio-package
      - name: Reject unresolved LaTeX citations or references
        run: |
          ! grep -E "Citation .* undefined|Reference .* undefined|There were undefined references" paper/main.log
          ! grep -E "Citation .* undefined|Reference .* undefined|There were undefined references" build/rio_anonymous_compile/main.log
          ! grep -E "Citation .* undefined|Reference .* undefined|There were undefined references" build/rio_identified_compile/main.log
      - name: Confirm clean source packages contain no build debris
        run: |
          test -z "$(find build/rio_anonymous -maxdepth 1 -type f \( -name '*.aux' -o -name '*.log' -o -name '*.pdf' -o -name '*.blg' -o -name '*.bbl' -o -name '*.fls' -o -name '*.fdb_latexmk' \) -print)"
          test -z "$(find build/rio_identified -maxdepth 1 -type f \( -name '*.aux' -o -name '*.log' -o -name '*.pdf' -o -name '*.blg' -o -name '*.bbl' -o -name '*.fls' -o -name '*.fdb_latexmk' \) -print)"
      - name: Check PDF font embedding
        run: |
          pdffonts build/rio_anonymous_compile/main.pdf | tee /tmp/anonymous-fonts.txt
          awk '$4 == "no" {print "UNEMBEDDED FONT:", $0; bad=1} END {exit bad}' /tmp/anonymous-fonts.txt
          pdffonts build/rio_identified_compile/main.pdf | tee /tmp/identified-fonts.txt
          awk '$4 == "no" {print "UNEMBEDDED FONT:", $0; bad=1} END {exit bad}' /tmp/identified-fonts.txt
      - name: Upload anonymous manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: rio-anonymous-manuscript-pdf
          path: build/rio_anonymous_compile/main.pdf
          if-no-files-found: error
      - name: Upload identified manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: rio-identified-manuscript-pdf
          path: build/rio_identified_compile/main.pdf
          if-no-files-found: error
      - name: Upload RIO title page
        uses: actions/upload-artifact@v4
        with:
          name: rio-title-page
          path: paper/title_page.pdf
          if-no-files-found: error
      - name: Upload anonymous RIO flat source package
        uses: actions/upload-artifact@v4
        with:
          name: rio-anonymous-flat-source
          path: build/rio_anonymous/
          if-no-files-found: error
      - name: Upload identified RIO flat source package
        uses: actions/upload-artifact@v4
        with:
          name: rio-identified-flat-source
          path: build/rio_identified/
          if-no-files-found: error
