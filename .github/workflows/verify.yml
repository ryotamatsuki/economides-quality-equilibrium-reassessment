name: reproducibility

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Exact symbolic verification
        run: python verification/symbolic_checks.py
      - name: Regression tests
        run: pytest -q
      - name: Regenerate deterministic outputs
        run: python scripts/generate_outputs.py
      - name: Check generated outputs are deterministic
        run: git diff --exit-code
      - name: Install TeX
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-base texlive-latex-extra texlive-bibtex-extra
      - name: Build manuscript scaffold
        run: make paper
